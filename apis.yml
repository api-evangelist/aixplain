aid: aixplain

name: aiXplain

image: https://www.aixplain.com/aixplain-og.png

description: aiXplain provides an operating system for autonomous work, enabling enterprises to build, orchestrate, and govern AI agents at scale
  while maintaining data privacy and compliance. The platform offers tools such as Studio for visual building, SDKs, on‑prem and air‑gapped deployments,
  and integrates with thousands of models across 63 countries. It targets regulated industries with SOC 2 Type II certification and supports enterprise,
  research, and pricing tiers.

